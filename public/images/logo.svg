    <path d="M10 10c-2 4-1 10 4 14" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M18 8c-4 0-8 4-8 10" stroke="url(#warnGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="14" cy="20" r="2" fill="url(#dangerGrad)"/>
  </g>
  <!-- RAIL text -->
  <text x="42" y="38" font-family="'Sora', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="1" fill="#10B981">RAIL</text>
  <!-- Bénin text -->
  <text x="104" y="38" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280">Bénin</text>
